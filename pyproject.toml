[project]
name = "sonofile"
version = "0.1.0"
description = "Automatic music library manager"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
]

[project.scripts]
sonofile = "sonofile.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonofile"]

[tool.ruff]
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sonofile --cov-report=term-missing"
